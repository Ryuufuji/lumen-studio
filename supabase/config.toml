# ---------------------------------------------------------------------------
# Lumen Studio — configuration Supabase locale
# Usage : `npm run supabase:start` puis `npm run supabase:reset`
# ---------------------------------------------------------------------------

project_id = "lumen-studio"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# 25 Mo : limite d'un import d'image original pleine résolution
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# En développement on veut pouvoir créer un compte sans e-mail de confirmation.
# Passer à `true` en production.
secure_email_change = false

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

# Les buckets sont crees par la migration 0003 (schema SQL), pas par la CLI.
